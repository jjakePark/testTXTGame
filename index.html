<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>시티 언더 그레이: 비상 프로토콜</title>
<meta name="description" content="말을 잃은 오빠의 의안 속에서 깨어난 비상 프로토콜. 텍스트 내러티브 게임 1막 체험판.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&family=Nanum+Gothic+Coding:wght@400;700&family=Noto+Serif+KR:wght@400;600&display=swap">
<style>
:root{
  --room:#16110c; --room-2:#211912; --rule:#3a2d20;
  --log:#d6c8b0; --dim:#8d7c63; --voice:#f6efe2; --amber:#f0a238; --cold:#7cc6d1;
  --ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --code:"Nanum Gothic Coding","D2Coding",ui-monospace,Menlo,Consolas,monospace;
  --serif:"Noto Serif KR","AppleMyungjo","Batang",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%; background:var(--room); scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; height:100%; background:var(--room); color:var(--log); font-family:var(--ui); font-size:15px; line-height:1.5}
button,input{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
*{scrollbar-width:thin; scrollbar-color:#4a3a28 transparent}
::-webkit-scrollbar{width:6px; height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#4a3a28; border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#8d6a3c}
::-webkit-scrollbar-corner{background:transparent}

/* title */
.title{position:fixed; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:0 24px; background:var(--room); z-index:5; transition:opacity .8s}
.title.gone{opacity:0; pointer-events:none}
.title .boot{font-family:var(--code); font-size:14px; color:var(--dim); line-height:1.9; min-height:5.7em}
.title .boot .on{color:var(--amber)}
.title h1{font-family:var(--serif); font-weight:600; color:var(--voice); font-size:clamp(30px,6vw,52px); line-height:1.2; margin:28px 0 8px; letter-spacing:-.02em}
.title .sub{color:var(--dim); font-size:14px; margin-bottom:36px}
.title .start{background:transparent; border:1px solid var(--amber); color:var(--amber); font-family:var(--code); font-size:15px; padding:9px 18px; border-radius:3px; cursor:pointer}
.title .start:hover{background:rgba(240,162,56,.1)}
.title .note{margin:28px auto 0; font-size:12.5px; color:#6e604d; max-width:46ch}

/* game */
#app{height:100%; display:grid; grid-template-rows:auto 1fr}
.bar{display:flex; align-items:center; gap:14px; padding:10px 20px; border-bottom:1px solid var(--rule); font-size:13px; flex-wrap:wrap}
.bar .name{font-family:var(--serif); color:var(--voice); font-size:14px}
.bar .sp{flex:1}
.bar label{display:flex; align-items:center; gap:8px; color:var(--dim); cursor:pointer}
.bar input[type=range]{width:84px; accent-color:var(--amber); cursor:pointer}
.bar .v{font-family:var(--code); color:var(--log)}
.bar button{background:transparent; border:1px solid var(--rule); color:var(--log); border-radius:6px; padding:4px 10px; font-size:13px; cursor:pointer}
.bar button:hover{border-color:var(--dim)}
.stage{position:relative; min-height:0; display:flex; flex-direction:column}
.feed{flex:1; min-height:0; overflow:auto; padding:32px 24px 28px; display:flex; flex-direction:column; align-items:center}
.log{flex:1; width:100%; max-width:62ch; display:flex; flex-direction:column; justify-content:flex-end; gap:4px}
.line{font-family:var(--code); font-size:15px; line-height:1.7; white-space:pre-wrap; transition:opacity .6s; margin:0}
.line.voice{font-family:var(--serif); color:var(--voice); font-size:16.5px; margin:4px 0}
.line.voice .who{display:block; font-family:var(--code); font-size:12px; color:var(--dim); margin-bottom:1px}
.line.glitch{color:var(--cold); letter-spacing:.06em}
.line.notice{color:var(--dim); font-size:13.5px; margin:10px 0}
.line.notice::before,.line.notice::after{content:"──"; margin:0 .5em; opacity:.6}
.line.notice::before{margin-left:0}
.line.echo{color:var(--amber); opacity:.75; font-size:14px; margin-top:6px}
.line.enter{animation:in .35s ease-out}
@keyframes in{from{opacity:0}to{opacity:1}}
.glitch.enter{animation:jitter .4s steps(4)}
@keyframes jitter{0%{transform:translateX(-3px);opacity:.2}50%{transform:translateX(2px)}100%{transform:none;opacity:1}}
.choices{width:100%; max-width:62ch; display:flex; flex-direction:column; align-items:flex-start; gap:8px; margin-top:18px}
.choice{background:transparent; border:1px solid var(--amber); color:var(--amber); font-family:var(--code); font-size:14.5px; padding:7px 14px; border-radius:3px; text-align:left; cursor:pointer}
.choice:hover{background:rgba(240,162,56,.1)}
.choice .sub{display:block; color:var(--dim); font-size:12.5px; margin-top:2px}
.endcard{margin-top:28px; font-family:var(--ui); color:var(--dim); font-size:14px; line-height:1.8}
.endcard strong{display:block; font-family:var(--serif); color:var(--voice); font-size:18px; font-weight:600; margin-bottom:4px}
.endcard button{margin-top:14px; background:transparent; border:1px solid var(--amber); color:var(--amber); font-family:var(--code); padding:7px 14px; border-radius:3px; cursor:pointer}
.status{order:-1; max-height:0; overflow:hidden; border-bottom:1px solid transparent; transition:max-height .5s ease, border-color .5s}
.status.open{max-height:200px; border-bottom-color:var(--rule)}
.status-inner{max-width:62ch; margin:0 auto; padding:12px 0; display:flex; justify-content:center; gap:28px; flex-wrap:wrap; font-family:var(--code); font-size:13px}
.status h2{font-family:var(--ui); font-size:12px; font-weight:400; color:var(--dim); margin:0 0 8px}
.status dl{margin:0; display:grid; grid-template-columns:1fr auto; gap:4px 10px}
.status dt{color:var(--dim)}
.status dd{margin:0; text-align:right}
.status dd.changed{color:var(--amber)}
.status ul{list-style:none; margin:0; padding:0}
.status li{padding:2px 0}
@media (min-width:1180px){
  .status{order:0; position:absolute; top:0; right:0; bottom:0; width:0; max-height:none; border-bottom:none; border-left:1px solid transparent; background:var(--room); transition:width .5s ease, border-color .5s}
  .status.open{width:220px; max-height:none; border-left-color:var(--rule)}
  .status-inner{width:220px; max-width:none; margin:0; padding:28px 18px; display:block}
  .status dl,.status ul{margin-bottom:22px}
}
@media (max-width:640px){ .feed{padding:22px 18px} .status-inner{padding:12px 18px; justify-content:flex-start} }
@media (prefers-reduced-motion: reduce){ .line.enter,.glitch.enter{animation:none} .status,.title{transition:none} }
</style>
</head>
<body>
<section class="title" id="title" aria-label="타이틀">
  <div class="boot" id="boot" aria-hidden="true"></div>
  <h1>시티 언더 그레이<br>비상 프로토콜</h1>
  <div class="sub">1막 체험판. 텍스트로만 진행되는 이야기입니다.</div>
  <button class="start" id="start">[ 연결 ]</button>
  <p class="note">선택지를 눌러 진행합니다. 위쪽 막대로 글이 올라오는 속도를 바꿀 수 있습니다.</p>
</section>
<div id="app">
  <header class="bar">
    <span class="name">비상 프로토콜</span>
    <span class="sp"></span>
    <label>속도 <input type="range" id="speed" min="1" max="5" step="1" value="3" aria-label="글 속도"> <span class="v" id="speedVal">3</span></label>
    <button id="restart">처음부터</button>
  </header>
  <main class="stage">
    <div class="feed" id="feed"><div class="log" id="log" aria-live="polite"></div><div class="choices" id="choices"></div></div>
    <aside class="status" id="status" aria-label="상태"><div class="status-inner" id="statusInner"></div></aside>
  </main>
</div>

var SPEEDS = {1:760, 2:540, 3:380, 4:200, 5:60}, BASE = 380, SKEY = "cug-speed";
var $ = function(id){ return document.getElementById(id); };

/* ---- locked scenes ---- */
function utf8(s){ return new TextEncoder().encode(s); }
function hash(s){ var h = 2166136261 >>> 0, b = utf8(s); for(var i = 0; i < b.length; i++){ h ^= b[i]; h = Math.imul(h, 16777619) >>> 0; } return h; }
function stream(seed){ var x = seed || 1; return function(){ x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0; return x & 255; }; }
function sid(name){ return hash("id:" + D.s + name).toString(36); }
var cache = {};
function scene(name){
  if(cache[name]) return cache[name];
  var raw = D.c[sid(name)]; if(!raw) return null;
  var bin = atob(raw), out = new Uint8Array(bin.length), k = stream(hash(D.s + name));
  for(var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i) ^ k();
  return (cache[name] = JSON.parse(new TextDecoder().decode(out)));
}

/* ---- state ---- */
var runId = 0, flags = {}, vars = {}, status = {}, modules = [], changed = null;
var logEl = $("log"), choicesEl = $("choices"), feed = $("feed");
function speed(){ var v = parseInt($("speed").value, 10); return SPEEDS[v] ? v : 3; }
function delay(){ return SPEEDS[speed()]; }
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function truthy(n){ return !!flags[n] || (vars[n] || 0) > 0; }
var ATOM = /^(.+?)\s*(>=|<=|==|!=|>|<)\s*(-?\d+(?:\.\d+)?)$/;
function atom(a){
  a = a.trim();
  if(a.charAt(0) === "!") return !atom(a.slice(1));
  var m = a.match(ATOM);
  if(m){ var v = vars[m[1].trim()] || 0, n = parseFloat(m[3]);
    switch(m[2]){ case ">=": return v >= n; case "<=": return v <= n; case ">": return v > n; case "<": return v < n; case "==": return v === n; case "!=": return v !== n; } }
  return truthy(a);
}
function cond(e){ return e.split(/\s*(?:\|\||또는)\s*/).some(function(p){ return p.split(/\s*(?:&&|그리고)\s*/).every(atom); }); }
function fill(t){ return String(t).replace(/\{([^{}]+)\}/g, function(m, k){ k = k.trim(); return Object.prototype.hasOwnProperty.call(vars, k) ? String(vars[k]) : m; }); }

function age(){ var k = logEl.children, n = k.length; for(var i = 0; i < n; i++) k[i].style.opacity = Math.max(0.32, 1 - (n - 1 - i) * 0.045).toFixed(2); }
function append(cls, text, who){
  var p = document.createElement("p"); p.className = "line " + cls + " enter";
  if(who){ var w = document.createElement("span"); w.className = "who"; w.textContent = who; p.appendChild(w); }
  p.appendChild(document.createTextNode(fill(text)));
  logEl.appendChild(p); age(); feed.scrollTop = feed.scrollHeight;
}
function renderStatus(){
  var inner = $("statusInner"); inner.innerHTML = "";
  var keys = Object.keys(status);
  if(modules.length){
    var h = document.createElement("h2"); h.textContent = "복구된 모듈"; inner.appendChild(h);
    var ul = document.createElement("ul");
    modules.forEach(function(m){ var li = document.createElement("li"); li.textContent = m; ul.appendChild(li); });
    inner.appendChild(ul);
  }
  if(keys.length){
    var h2 = document.createElement("h2"); h2.textContent = "감지 수치"; inner.appendChild(h2);
    var dl = document.createElement("dl");
    keys.forEach(function(k){
      var dt = document.createElement("dt"); dt.textContent = k;
      var dd = document.createElement("dd"); dd.textContent = status[k]; if(k === changed) dd.className = "changed";
      dl.appendChild(dt); dl.appendChild(dd);
    });
    inner.appendChild(dl);
  }
  $("status").classList.toggle("open", !!(modules.length || keys.length));
}

async function perform(it, id){
  switch(it.type){
    case "log": await sleep(delay()); if(id !== runId) return; append("", it.text); break;
    case "voice": await sleep(delay() * 1.4); if(id !== runId) return; append("voice", "\u201c" + it.text + "\u201d", it.speaker); break;
    case "glitch": await sleep(delay()); if(id !== runId) return; append("glitch", it.text); break;
    case "notice": await sleep(delay()); if(id !== runId) return; append("notice", it.text); break;
    case "module": if(modules.indexOf(it.name) < 0) modules.push(it.name); await sleep(delay()); if(id !== runId) return; append("notice", it.name + " 모듈 복구됨"); renderStatus(); break;
    case "unmodule": var mi = modules.indexOf(it.name); if(mi >= 0) modules.splice(mi, 1); renderStatus(); break;
    case "set": if(it.val === null) delete status[it.key]; else status[it.key] = fill(it.val); changed = it.key; renderStatus(); break;
    case "flag": if(it.on) flags[it.name] = true; else delete flags[it.name]; break;
    case "var": var cv = vars[it.name] || 0; vars[it.name] = it.op === "+" ? cv + it.n : it.op === "-" ? cv - it.n : it.n; break;
    case "wait": await sleep(Math.round(it.ms * delay() / BASE)); break;
  }
}
function choose(list, id){
  return new Promise(function(resolve){
    choicesEl.innerHTML = "";
    list.forEach(function(ch){
      var b = document.createElement("button"); b.className = "choice";
      b.appendChild(document.createTextNode("[ " + fill(ch.label) + " ]"));
      if(ch.sub){ var s = document.createElement("span"); s.className = "sub"; s.textContent = fill(ch.sub); b.appendChild(s); }
      b.onclick = function(){ if(id !== runId) return; choicesEl.innerHTML = ""; append("echo", "\u25b8 " + ch.label); resolve(ch.target); };
      choicesEl.appendChild(b);
    });
    var f = choicesEl.querySelector("button"); if(f) f.focus({preventScroll:true});
    feed.scrollTop = feed.scrollHeight;
  });
}
function endcard(){
  var e = document.createElement("div"); e.className = "endcard";
  var s = document.createElement("strong"); s.textContent = D.endTitle; e.appendChild(s);
  e.appendChild(document.createTextNode(D.endText));
  var b = document.createElement("button"); b.textContent = "[ 처음부터 ]"; b.onclick = function(){ run(); };
  e.appendChild(document.createElement("br")); e.appendChild(b);
  choicesEl.appendChild(e); feed.scrollTop = feed.scrollHeight;
}
async function run(){
  var id = ++runId;
  flags = {}; vars = {}; status = {}; modules = []; changed = null;
  logEl.innerHTML = ""; choicesEl.innerHTML = ""; renderStatus();
  var name = D.first;
  while(name && id === runId){
    var items = scene(name); if(!items) return;
    var choices = [], next = null;
    for(var i = 0; i < items.length; i++){
      var it = items[i];
      if(id !== runId) return;
      if(it.type === "choice"){ choices.push(it); continue; }
      if(it.when && !cond(it.when)) continue;
      if(it.type === "goto"){ next = it.target; break; }
      await perform(it, id);
    }
    if(id !== runId) return;
    if(next){ name = next; continue; }
    var vis = choices.filter(function(c){ return !c.when || cond(c.when); });
    if(!vis.length){ endcard(); return; }
    name = await choose(vis, id);
  }
}

/* ---- title, speed ---- */
(function(){
  var sp = $("speed"), sv = $("speedVal");
  try{ var s = localStorage.getItem(SKEY); if(s && SPEEDS[s]) sp.value = s; }catch(e){}
  sv.textContent = sp.value;
  sp.addEventListener("input", function(){ sv.textContent = sp.value; try{ localStorage.setItem(SKEY, sp.value); }catch(e){} });
})();
(function(){
  var lines = ["> 메인 시스템 응답 없음.", "> 대상 의식 소실 감지.", "> 비상 프로토콜 대기."], boot = $("boot"), i = 0;
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function next(){
    if(i >= lines.length) return;
    var d = document.createElement("div"); d.textContent = lines[i]; if(i === lines.length - 1) d.className = "on";
    boot.appendChild(d); i++; setTimeout(next, reduce ? 0 : 650);
  }
  setTimeout(next, reduce ? 0 : 400);
})();
$("start").onclick = function(){ $("title").classList.add("gone"); setTimeout(function(){ $("title").hidden = true; }, 820); run(); };
$("restart").onclick = function(){ run(); };
})();
</script>
